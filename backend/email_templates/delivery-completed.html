<div style="font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; color:#0f172a; max-width:680px; margin:0 auto; padding:20px; background:#f8fafc;">
  <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:680px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e6edf3;box-shadow:0 18px 40px rgba(15,23,42,0.08);">
    <tr><td style="height:8px;background:linear-gradient(90deg,#1d4ed8 0%,#0f766e 100%);"></td></tr>
    <tr>
      <td style="padding:24px 24px 10px;background:#ffffff;text-align:center;">
        <div style="display:inline-block;padding:10px 16px;border:1px solid #dbe7f3;border-radius:12px;background:#fbfdff;">
          <img src="cid:company-logo" alt="Absolute Veritas" style="height:44px;display:block;margin:0 auto;" />
        </div>
        <div style="margin-top:14px;display:inline-block;padding:6px 12px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:700;letter-spacing:.02em;">DELIVERED</div>
      </td>
    </tr>
    <tr>
      <td style="padding:28px 28px 8px;">
        <h1 style="font-size:24px;line-height:1.25;margin:0 0 12px;color:#16325c;text-align:center;">Report Delivered</h1>
        <p style="margin:0 auto 20px;color:#475569;text-align:center;max-width:540px;line-height:1.7;">The report has been delivered successfully. Delivery details are shown below.</p>
        <div style="background:#f8fbff;border:1px solid #dbe7f3;border-radius:14px;padding:18px 20px;color:#334155;line-height:1.75;">
          <div><strong>Report ID:</strong> {{reportId}}</div>
          <div><strong>Delivery Time:</strong> {{deliveredAt}}</div>
          <div><strong>Recipient:</strong> {{deliveredTo}}</div>
        </div>
        <div style="text-align:center;margin:28px 0 18px;">
          <a href="{{viewUrl}}" style="display:inline-block;background:#1d4ed8;color:#fff;padding:13px 28px;border-radius:12px;text-decoration:none;font-weight:700;box-shadow:0 12px 24px rgba(29,78,216,0.20);">View / Download</a>
        </div>
      </td>
    </tr>
    <tr>
      <td style="padding:18px 24px 22px;background:#fbfdff;text-align:center;color:#94a3b8;font-size:12px;border-top:1px solid #eef2f7;">© {{year}} Absolute Veritas • <a href="mailto:cs@absoluteveritas.com" style="color:#1d4ed8;text-decoration:none;">cs@absoluteveritas.com</a></td>
    </tr>
  </table>
</div>
